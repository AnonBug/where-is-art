name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run content:build && git diff --exit-code --stat -- public/catalog.json
      - run: npm test
      - run: npm run media:check
      - run: npm run content:check:remote -- --expected-local
      - run: |
          if [ -z "$VITE_TIANDITU_KEY" ]; then
            echo "Configure the VITE_TIANDITU_KEY Actions secret with a Tianditu browser Key."
            exit 1
          fi
          npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_TIANDITU_KEY: ${{ secrets.VITE_TIANDITU_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
